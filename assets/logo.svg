<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="botnot - auto-order Telegram and Discord bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wmLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <!-- Soft accent glows (using ellipses with opacity instead of radial gradients) -->
  <ellipse cx="180" cy="180" rx="240" ry="180" fill="#22d3ee" opacity="0.08"/>
  <ellipse cx="1100" cy="180" rx="260" ry="200" fill="#a78bfa" opacity="0.08"/>

  <!-- Border highlight -->
  <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- ===== BOT ICON (left) ===== -->
  <g transform="translate(110,90)">
    <!-- Soft halo: stack of fading rects -->
    <rect x="-12" y="-12" width="204" height="204" rx="48" fill="#22d3ee" opacity="0.06"/>
    <rect x="-6" y="-6" width="192" height="192" rx="42" fill="#a78bfa" opacity="0.08"/>

    <!-- Frame -->
    <rect width="180" height="180" rx="36" fill="url(#brand)"/>

    <!-- Bot icon -->
    <g stroke="#0a0e1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="90" y1="36" x2="90" y2="54"/>
      <circle cx="90" cy="34" r="7" fill="#0a0e1a"/>
      <rect x="36" y="60" width="108" height="78" rx="14"/>
      <line x1="66" y1="96" x2="66" y2="98"/>
      <line x1="114" y1="96" x2="114" y2="98"/>
      <line x1="78" y1="118" x2="84" y2="118"/>
      <line x1="93" y1="118" x2="99" y2="118"/>
      <line x1="108" y1="118" x2="114" y2="118"/>
    </g>
  </g>

  <!-- ===== TEXT BLOCK (right) ===== -->
  <g transform="translate(330,0)">
    <!-- Eyebrow tag -->
    <g transform="translate(0,90)">
      <rect width="220" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.3"/>
      <circle cx="20" cy="16" r="4" fill="#22d3ee"/>
      <text x="36" y="21" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#67e8f9">Auto-order &#183; QRIS &#183; ID</text>
    </g>

    <!-- Wordmark -->
    <text x="0" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="128" font-weight="800">
      <tspan fill="url(#wmLight)">bot</tspan><tspan fill="url(#wmAccent)">not</tspan>
    </text>

    <!-- Tagline -->
    <text x="4" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Telegram + Discord bot &#8212; scan QR, produk auto-deliver.</text>

    <!-- Pills -->
    <g transform="translate(4,300)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">
      <!-- Telegram -->
      <g>
        <rect width="100" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
        <text x="50" y="19" text-anchor="middle" fill="#67e8f9">Telegram</text>
      </g>
      <!-- Discord -->
      <g transform="translate(108,0)">
        <rect width="92" height="30" rx="15" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.3"/>
        <text x="46" y="19" text-anchor="middle" fill="#c4b5fd">Discord</text>
      </g>
      <!-- KlikQRIS -->
      <g transform="translate(208,0)">
        <rect width="96" height="30" rx="15" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
        <text x="48" y="19" text-anchor="middle" fill="#6ee7b7">KlikQRIS</text>
      </g>
      <!-- Auto-deliver -->
      <g transform="translate(312,0)">
        <rect width="108" height="30" rx="15" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3"/>
        <text x="54" y="19" text-anchor="middle" fill="#fcd34d">Auto-deliver</text>
      </g>
      <!-- Dashboard -->
      <g transform="translate(428,0)">
        <rect width="100" height="30" rx="15" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="50" y="19" text-anchor="middle" fill="#f9a8d4">Dashboard</text>
      </g>
    </g>
  </g>

  <!-- Decorative sparkles -->
  <g fill="#22d3ee" opacity="0.6">
    <circle cx="240" cy="50" r="2"/>
    <circle cx="900" cy="40" r="1.5"/>
    <circle cx="1180" cy="260" r="2"/>
  </g>
  <g fill="#a78bfa" opacity="0.5">
    <circle cx="800" cy="320" r="1.5"/>
    <circle cx="320" cy="30" r="1.5"/>
  </g>
</svg>
