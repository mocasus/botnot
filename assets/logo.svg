<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="botnot - auto-order Telegram and Discord bot">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <!-- Brand gradient (cyan -> violet) — matches dashboard -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="brandDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- "bot" wordmark — white to slate -->
    <linearGradient id="wmLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- "not" wordmark — cyan to violet -->
    <linearGradient id="wmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
    </pattern>

    <!-- Soft glow for icon -->
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial ambient lights -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== BACKGROUND LAYER ===== -->
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="180" cy="180" rx="260" ry="200" fill="url(#glowCyan)"/>
  <ellipse cx="1100" cy="180" rx="280" ry="220" fill="url(#glowViolet)"/>

  <!-- Subtle border highlight -->
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- ===== LEFT: BOT ICON ===== -->
  <g transform="translate(110,90)">
    <!-- Glow halo behind icon -->
    <circle cx="90" cy="90" r="80" fill="url(#brandDiag)" opacity="0.18" filter="url(#iconGlow)"/>

    <!-- Rounded square frame (matches dashboard logo) -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="url(#brandDiag)"/>

    <!-- Icon: stylized bot (matches Lucide-style "bot" used in dashboard) -->
    <g stroke="#0a0e1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- antenna -->
      <line x1="90" y1="36" x2="90" y2="54"/>
      <circle cx="90" cy="34" r="7" fill="#0a0e1a"/>
      <!-- head body -->
      <rect x="36" y="60" width="108" height="78" rx="14"/>
      <!-- eyes -->
      <line x1="66" y1="96" x2="66" y2="98"/>
      <line x1="114" y1="96" x2="114" y2="98"/>
      <!-- mouth (3-cell) -->
      <line x1="78" y1="118" x2="84" y2="118"/>
      <line x1="93" y1="118" x2="99" y2="118"/>
      <line x1="108" y1="118" x2="114" y2="118"/>
    </g>
  </g>

  <!-- ===== RIGHT: WORDMARK + TAGLINE + PILLS ===== -->
  <g transform="translate(330,0)">
    <!-- Top eyebrow tag -->
    <g transform="translate(0,90)">
      <rect width="220" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="20" cy="16" r="4" fill="#22d3ee"/>
      <text x="36" y="21" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#67e8f9" letter-spacing="0.5">Auto-order · QRIS · ID</text>
    </g>

    <!-- Main wordmark: "bot" + "not" -->
    <g transform="translate(0,140)">
      <text x="0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="128" font-weight="800" letter-spacing="-5">
        <tspan fill="url(#wmLight)">bot</tspan><tspan fill="url(#wmAccent)">not</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <g transform="translate(4,260)">
      <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">
        Telegram + Discord bot — pelanggan scan QR, produk auto-deliver.
      </text>
    </g>

    <!-- Feature pills row -->
    <g transform="translate(4,288)" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      <!-- Pill: Telegram -->
      <g>
        <rect width="106" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
        <g transform="translate(12,8)" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 1L8 9 1 7l15-6z"/>
          <path d="M16 1l-2 14-4-5"/>
        </g>
        <text x="38" y="20" fill="#67e8f9">Telegram</text>
      </g>

      <!-- Pill: Discord -->
      <g transform="translate(118,0)">
        <rect width="98" height="32" rx="16" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1"/>
        <g transform="translate(12,8)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="7.5"/>
          <line x1="5" y1="6.5" x2="5" y2="6.51"/>
          <line x1="11" y1="6.5" x2="11" y2="6.51"/>
          <path d="M4.5 10.5s1.2 1.6 3.5 1.6 3.5-1.6 3.5-1.6"/>
        </g>
        <text x="34" y="20" fill="#c4b5fd">Discord</text>
      </g>

      <!-- Pill: KlikQRIS -->
      <g transform="translate(228,0)">
        <rect width="100" height="32" rx="16" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
        <g transform="translate(12,8)" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="1" width="6" height="6" rx="0.8"/>
          <rect x="9" y="1" width="6" height="6" rx="0.8"/>
          <rect x="1" y="9" width="6" height="6" rx="0.8"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="14" y1="9" x2="14.01" y2="9"/>
          <line x1="11.5" y1="11.5" x2="11.51" y2="11.51"/>
          <line x1="9" y1="14" x2="9.01" y2="14"/>
          <line x1="14" y1="14" x2="14.01" y2="14"/>
        </g>
        <text x="34" y="20" fill="#6ee7b7">KlikQRIS</text>
      </g>

      <!-- Pill: Auto-deliver -->
      <g transform="translate(340,0)">
        <rect width="120" height="32" rx="16" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
        <g transform="translate(12,8)" fill="none" stroke="#fcd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 1 3 14 12 14 11 22 21 9 12 9 13 1" transform="scale(0.75) translate(0,-1)"/>
        </g>
        <text x="34" y="20" fill="#fcd34d">Auto-deliver</text>
      </g>

      <!-- Pill: Dashboard -->
      <g transform="translate(472,0)">
        <rect width="118" height="32" rx="16" fill="#ec4899" fill-opacity="0.08" stroke="#ec4899" stroke-opacity="0.25" stroke-width="1"/>
        <g transform="translate(12,8)" fill="none" stroke="#f9a8d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="10" y1="14" x2="10" y2="6"/>
          <line x1="6" y1="14" x2="6" y2="2"/>
          <line x1="2" y1="14" x2="2" y2="9"/>
          <line x1="14" y1="14" x2="14" y2="11"/>
          <line x1="0" y1="14" x2="14" y2="14"/>
        </g>
        <text x="34" y="20" fill="#f9a8d4">Dashboard</text>
      </g>
    </g>
  </g>

  <!-- ===== DECORATIVE SPARKLES ===== -->
  <g fill="#22d3ee" opacity="0.7">
    <circle cx="240" cy="50" r="2"/>
    <circle cx="900" cy="40" r="1.5"/>
    <circle cx="60" cy="280" r="1.5"/>
    <circle cx="1180" cy="260" r="2"/>
    <circle cx="1220" cy="80" r="1.5"/>
  </g>
  <g fill="#a78bfa" opacity="0.6">
    <circle cx="800" cy="320" r="1.5"/>
    <circle cx="320" cy="20" r="1.5"/>
    <circle cx="1100" cy="320" r="2"/>
  </g>
</svg>
