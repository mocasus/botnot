<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="botnot social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#15192e"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wmLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Soft accent glows -->
  <ellipse cx="200" cy="200" rx="320" ry="240" fill="#22d3ee" opacity="0.08"/>
  <ellipse cx="1080" cy="440" rx="320" ry="240" fill="#a78bfa" opacity="0.08"/>

  <!-- ===== TOP-LEFT: Brand mark ===== -->
  <g transform="translate(80,80)">
    <g transform="translate(0,0)" filter="url(#glow)">
      <line x1="48" y1="-22" x2="48" y2="0" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="48" cy="-18" r="7" fill="url(#grad)"/>
      <rect x="0" y="0" width="96" height="84" rx="20" fill="url(#grad)"/>
      <circle cx="32" cy="36" r="9" fill="#0a0e1a"/>
      <circle cx="64" cy="36" r="9" fill="#0a0e1a"/>
      <circle cx="34" cy="33" r="2.5" fill="#ffffff"/>
      <circle cx="66" cy="33" r="2.5" fill="#ffffff"/>
      <g transform="translate(28,58)" fill="#0a0e1a">
        <rect x="0" y="0" width="8" height="8" rx="1.5"/>
        <rect x="11" y="0" width="8" height="8" rx="1.5"/>
        <rect x="22" y="0" width="8" height="8" rx="1.5"/>
        <rect x="33" y="0" width="8" height="8" rx="1.5"/>
      </g>
    </g>
    <text x="116" y="50" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5"><tspan fill="url(#wmLight)">bot</tspan><tspan fill="url(#grad)">not</tspan></text>
    <text x="118" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Auto-order Telegram &amp; Discord bot</text>
  </g>

  <!-- ===== CENTER: Headline + Tagline ===== -->
  <g transform="translate(80,260)">
    <text font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-3">Pelanggan scan,</text>
    <text y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#grad)">produk auto-deliver.</text>
  </g>

  <!-- ===== Subtitle ===== -->
  <g transform="translate(80,476)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">Bot otomatis yang terintegrasi dengan KlikQRIS.</text>
    <text y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">Stok akun, license, voucher dikirim langsung ke DM pembeli.</text>
  </g>

  <!-- ===== Feature chips ===== -->
  <g transform="translate(80,564)" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect width="108" height="34" rx="17" fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.4"/>
      <text x="54" y="22" text-anchor="middle" fill="#22d3ee">Telegram</text>
    </g>
    <g transform="translate(120,0)">
      <rect width="100" height="34" rx="17" fill="#0a0e1a" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="50" y="22" text-anchor="middle" fill="#a78bfa">Discord</text>
    </g>
    <g transform="translate(232,0)">
      <rect width="106" height="34" rx="17" fill="#0a0e1a" stroke="#34d399" stroke-width="1.4"/>
      <text x="53" y="22" text-anchor="middle" fill="#34d399">KlikQRIS</text>
    </g>
    <g transform="translate(350,0)">
      <rect width="124" height="34" rx="17" fill="#0a0e1a" stroke="#fbbf24" stroke-width="1.4"/>
      <text x="62" y="22" text-anchor="middle" fill="#fbbf24">Auto-deliver</text>
    </g>
    <g transform="translate(486,0)">
      <rect width="116" height="34" rx="17" fill="#0a0e1a" stroke="#f472b6" stroke-width="1.4"/>
      <text x="58" y="22" text-anchor="middle" fill="#f472b6">Dashboard</text>
    </g>
  </g>

  <!-- ===== Top-right corner: GitHub mark ===== -->
  <g transform="translate(1140,80)" fill="#94a3b8">
    <text x="0" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#cbd5e1">github.com/mocasus/botnot</text>
    <text x="0" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="end" fill="#64748b">MIT License &#183; Made in Indonesia</text>
  </g>
</svg>
